spring.application.name=playhavior

# ===== DATABASE: in-memory H2, empty on every restart =====
# TODO: file-based H2 or PostgreSQL when data must survive restarts
spring.datasource.url=jdbc:h2:mem:playhavior;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 CONSOLE: localhost:8080/h2-console (JDBC URL above, user sa, no password) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA: create/update tables from the @Entity classes; print every SQL statement =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== THYMELEAF: reload templates on every request, so HTML edits show without a restart =====
spring.thymeleaf.cache=false

# ===== PLAYHAVIOR RULES: read by PenaltyEligibilityService =====
# Temporary bans/suspensions at least this many days long get REINSTATEMENT_SUPPORT
playhavior.minimum-review-days=7
