<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*
  Shared head + nav bar. Pages include them with th:replace.
  WHY: one copy of the stylesheet link and header (the original unstyled-page bug
       came from each page having its own broken copy).
*/-->

<!-- Shared <head>: pass the page title in, e.g.
     th:replace="~{fragments/layout :: head('Submit Your Notice')}" -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' | PlayHavior'">PlayHavior</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">

  <link rel="stylesheet" th:href="@{/css/playhavior.css}">
</head>

<body>

<!-- Shared header: pass the active nav item
     ('dashboard', 'pathway', 'notice' or 'completion'). -->
<header class="site-header" th:fragment="header(active)">
  <nav class="nav-shell" aria-label="Main navigation">

    <a th:href="@{/}" class="brand">
      <span class="brand-icon" aria-hidden="true">🎮</span>
      <span>PlayHavior</span>
    </a>

    <div class="nav-links">
      <a th:href="@{/dashboard}"
         th:classappend="${active == 'dashboard'} ? 'active'"
         th:attr="aria-current=${active == 'dashboard'} ? 'page'">
        Dashboard
      </a>

      <a th:href="@{/pathways/latest}"
         th:classappend="${active == 'pathway'} ? 'active'"
         th:attr="aria-current=${active == 'pathway'} ? 'page'">
        My Pathway
      </a>

      <a th:href="@{/notices/new}"
         th:classappend="${active == 'notice'} ? 'active'"
         th:attr="aria-current=${active == 'notice'} ? 'page'">
        Submit Notice
      </a>

      <!--/* Completion = the appeal packet (CompletionController) */-->
      <a th:href="@{/completion}"
         th:classappend="${active == 'completion'} ? 'active'"
         th:attr="aria-current=${active == 'completion'} ? 'page'">
        Completion
      </a>
    </div>

    <div class="nav-account">
      <button type="button" class="sign-out" disabled title="Login is not built yet">
        Sign out
      </button>
      <!--/* ${navInitials} comes from NavigationModelAdvice (added to every page) */-->
      <div class="avatar" aria-label="Player initials"
           th:text="${navInitials} ?: 'JL'">JL</div>
    </div>

  </nav>
</header>

</body>
</html>
