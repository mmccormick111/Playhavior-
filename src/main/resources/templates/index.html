<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Playhavior | Accountability Intake</title>
</head>
<body>

<h1>Playhavior</h1>
<p>Player Accountability and Reinstatement Support</p>

<h2>Start Your Learning Pathway</h2>

<form th:action="@{/workflow/start}" method="post">

    <p>
        <label for="displayName">Display Name:</label>
        <input id="displayName" name="displayName" type="text" required>
    </p>

    <p>
        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required>
    </p>

    <p>
        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>
    </p>

    <p>
        <label for="platform">Gaming Platform:</label>
        <select id="platform" name="platform" required>
            <option value="">-- Select a platform --</option>
            <option value="PlayStation Network">PlayStation Network</option>
            <option value="Xbox Network">Xbox Network</option>
            <option value="Steam">Steam</option>
            <option value="Nintendo Switch Online">Nintendo Switch Online</option>
            <option value="Epic Games">Epic Games</option>
        </select>
    </p>

    <p>
        <label for="statedReason">Stated Ban Reason:</label>
        <select id="statedReason" name="statedReason" required>
            <option value="">-- Select a reason --</option>
            <option value="Harassment or abusive chat">
                Harassment or abusive chat
            </option>
            <option value="Hate speech or discriminatory language">
                Hate speech or discriminatory language
            </option>
            <option value="Griefing or intentional disruption">
                Griefing or intentional disruption
            </option>
            <option value="Cheating or exploiting game systems">
                Cheating or exploiting game systems
            </option>
        </select>
    </p>

    <button type="submit">Generate My Learning Pathway</button>
</form>

</body>
</html>
